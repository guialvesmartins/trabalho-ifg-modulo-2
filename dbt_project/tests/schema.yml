version: 2

models:
  - name: stg_pump_metadata
    description: "Staging dos metadados do dataset MIMII Pump"
    columns:
      - name: file_id
        description: "ID unico do arquivo de audio"
        tests:
          - not_null
          - unique
      - name: machine_type
        description: "Tipo de maquina"
        tests:
          - not_null
      - name: model_id
        description: "ID do modelo da maquina"
        tests:
          - not_null
      - name: condition
        description: "Condicao da maquina (normal ou anomaly)"
        tests:
          - not_null
          - accepted_values:
              values: ["normal", "anomaly"]

  - name: stg_audio_features
    description: "Staging das features de audio extraidas com librosa (MFCC, espectrais, ZCR, RMS), com cast para numeric"
    columns:
      - name: file_id
        description: "ID unico do arquivo de audio (join key com stg_pump_metadata)"
        tests:
          - not_null
          - unique

  - name: dim_machines
    description: "Dimensao de maquinas com metricas agregadas"
    columns:
      - name: machine_type
        description: "Tipo de maquina (pump)"
        tests:
          - not_null
      - name: model_id
        description: "ID do modelo da maquina"
        tests:
          - not_null
      - name: total_samples
        description: "Total de amostras de audio por modelo"
        tests:
          - not_null

  - name: fact_audio_analysis
    description: "Fato com features de audio e condicao da maquina"
    columns:
      - name: file_id
        description: "ID unico do arquivo de audio"
        tests:
          - not_null
          - unique
      - name: condition_binary
        description: "Target binario do modelo ML (0=normal, 1=anomalia)"
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

  - name: ml_features
    description: "Tabela final pronta para Machine Learning"
    columns:
      - name: condition_binary
        description: "Target do modelo — se a maquina esta com anomalia"
        tests:
          - not_null
