version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pf-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pf-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  airflow-init:
    image: apache/airflow:2.9.0
    container_name: pf-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command: |
      -c "
      airflow db init &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      "
    environment: &airflow-env
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project

  airflow-webserver:
    image: apache/airflow:2.9.0
    container_name: pf-airflow-web
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment: *airflow-env
    command: webserver
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project

  airflow-scheduler:
    image: apache/airflow:2.9.0
    container_name: pf-airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project

  metabase:
    image: metabase/metabase:latest
    container_name: pf-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: airflow
      MB_DB_PORT: 5432
      MB_DB_USER: airflow
      MB_DB_PASS: airflow
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabasedata:/metabase-data

  metabase-setup:
    image: python:3.11-slim
    container_name: pf-metabase-setup
    depends_on:
      postgres:
        condition: service_healthy
      metabase:
        condition: service_started
    environment:
      METABASE_URL: http://metabase:3000
      METABASE_ADMIN: admin@projeto.com
      METABASE_PASS: ProjetoIFG2025!
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: airflow
      DB_PASS: airflow
      DB_NAME: airflow
    entrypoint: /bin/bash
    command: >
      -c "
      pip install -q requests &&
      python3 /scripts/setup_metabase.py
      "
    volumes:
      - ./scripts:/scripts

volumes:
  pgdata:
  miniodata:
  metabasedata:
